# electron-builder 的配置放在单独的文件里，不放 package.json：
# package.json 会被各种工具重写（npm 就会），配置单独放不容易丢。
appId: dev.pi-observer.desktop
productName: pi-observer

directories:
  # 输出到 dist/：out/ 是 electron-vite 的构建产物，两者不能同目录，
  # 否则 files: out/** 会把正在生成的 .app 自己也打进 app.asar（实测多出 270 MB）
  output: dist
  buildResources: build

# 主进程与 preload 打进 app.asar；渲染进程的静态文件也在里面。
# 没有需要子进程直接读的额外资源——探针源码不进包，由人手动装到 Pi。
files:
  - out/**
  - package.json
  - "!**/*.map"

mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  contents:
    - x: 180
      y: 220
    - x: 460
      y: 220
      type: link
      path: /Applications
